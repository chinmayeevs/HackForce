<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Civic Resolve - Offline Grievance Portal</title>
  <style>
    :root {
      --primary: #2563eb;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #1e293b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 580px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    h1 { font-size: 20px; font-weight: 700; }
    
    .status-badge { font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 9999px; text-transform: uppercase; }
    .status-badge.online { background: #dcfce7; color: var(--success); }
    .status-badge.offline { background: #fee2e2; color: var(--danger); }

    .field { margin-bottom: 16px; }
    label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--primary); }
    textarea { height: 90px; resize: vertical; }

    button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; }
    button:hover { opacity: 0.9; }

    .sync-counter { margin-top: 12px; text-align: center; font-size: 13px; color: var(--warning); font-weight: 500; }

    .alert { position: fixed; bottom: 20px; right: 20px; max-width: 320px; padding: 12px 16px; border-radius: 8px; font-size: 13px; color: white; display: none; z-index: 9999; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .alert.info { background: var(--primary); }
    .alert.success { background: var(--success); }
    .alert.warning { background: var(--warning); }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>Mysuru Civic Grievance</h1>
      <span id="connection-badge" class="status-badge online">Online</span>
    </div>

    <form id="grievance-form">
      <div class="field">
        <label for="category">Issue Category</label>
        <select id="category" name="category" required>
          <option value="Roads & Potholes">Roads & Potholes</option>
          <option value="Drainage & Sewage">Drainage & Sewage</option>
          <option value="Garbage Overflow">Garbage Overflow</option>
          <option value="Streetlight Fault">Streetlight Fault</option>
          <option value="Illegal Encroachment / Dumping">Illegal Encroachment / Dumping</option>
        </select>
      </div>

      <div class="field">
        <label for="description">Detailed Description</label>
        <textarea id="description" name="description" placeholder="Describe the location or issue..." required></textarea>
      </div>

      <input type="hidden" id="lat" name="lat" value="12.2958" />
      <input type="hidden" id="lng" name="lng" value="76.6394" />

      <button type="submit" id="submit-btn">File Complaint</button>
      <div id="queue-indicator" class="sync-counter"></div>
    </form>
  </div>

  <div id="toast-banner" class="alert"></div>

  <script>
    const STORAGE_KEY = 'pending_civic_complaints';

    // --- 1. SERVICE WORKER SETUP (Inline Data URI Cache) ---
    if ('serviceWorker' in navigator) {
      const swScript = `
        const CACHE_NAME = 'civic-offline-v1';
        self.addEventListener('install', (e) => {
          self.skipWaiting();
        });
        self.addEventListener('activate', (e) => {
          e.waitUntil(clients.claim());
        });
        self.addEventListener('fetch', (e) => {
          if (e.request.method === 'GET') {
            e.respondWith(
              fetch(e.request).catch(() => caches.match(e.request))
            );
          }
        });
      `;
      const blob = new Blob([swScript], { type: 'text/javascript' });
      navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(console.error);
    }

    // --- 2. LOCAL STORAGE QUEUE ENGINE ---
    function getStoredQueue() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function pushToLocalQueue(record) {
      const queue = getStoredQueue();
      queue.push({
        ...record,
        localId: 'ticket_' + Date.now(),
        timestamp: new Date().toISOString()
      });
      localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
      refreshQueueUI();
    }

    function clearLocalQueue() {
      localStorage.removeItem(STORAGE_KEY);
      refreshQueueUI();
    }

    // --- 3. UI NOTIFIERS & STATUS MONITORING ---
    const badge = document.getElementById('connection-badge');
    const queueUI = document.getElementById('queue-indicator');
    const toast = document.getElementById('toast-banner');

    function showToast(text, level = 'info') {
      toast.className = 'alert ' + level;
      toast.textContent = text;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function refreshQueueUI() {
      const count = getStoredQueue().length;
      queueUI.textContent = count > 0 ? `⚠️ ${count} complaint(s) waiting to sync` : '';
    }

    function updateNetworkStatus() {
      if (navigator.onLine) {
        badge.textContent = 'Online';
        badge.className = 'status-badge online';
      } else {
        badge.textContent = 'Offline';
        badge.className = 'status-badge offline';
      }
    }

    window.addEventListener('load', () => {
      updateNetworkStatus();
      refreshQueueUI();
    });

    window.addEventListener('offline', () => {
      updateNetworkStatus();
      showToast('Network disconnected. Offline mode active.', 'warning');
    });

    // --- 4. DATA TRANSMISSION & CLOUD DISPATCH ---
    async function dispatchComplaint(payload) {
      // MOCK DISPATCH: Replace this URL with your Supabase or backend endpoint
      const response = await fetch('https://jsonplaceholder.typicode.com/posts', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!response.ok) throw new Error('API server rejected request');
      return await response.json();
    }

    // --- 5. SUBMIT HANDLER (INTERCEPT & BUFFER) ---
    document.getElementById('grievance-form').addEventListener('submit', async (e) => {
      e.preventDefault();

      const form = e.target;
      const payload = {
        category: form.category.value,
        description: form.description.value,
        coordinates: {
          lat: form.lat.value,
          lng: form.lng.value
        }
      };

      // Case A: Device is offline
      if (!navigator.onLine) {
        pushToLocalQueue(payload);
        showToast('Saved offline! Will sync automatically when reconnected.', 'warning');
        form.reset();
        return;
      }

      // Case B: Device is online (with fallback on sudden disconnection)
      try {
        await dispatchComplaint(payload);
        showToast('Complaint uploaded successfully to municipal registry!', 'success');
        form.reset();
      } catch (err) {
        console.warn('Network timeout during submit, saving to local cache:', err);
        pushToLocalQueue(payload);
        showToast('Connection interrupted. Complaint buffered locally.', 'warning');
        form.reset();
      }
    });

    // --- 6. AUTO-SYNC RECONCILIATION ENGINE ---
    window.addEventListener('online', async () => {
      updateNetworkStatus();
      const queue = getStoredQueue();
      if (queue.length === 0) return;

      showToast(`Back online! Uploading ${queue.length} pending ticket(s)...`, 'info');

      const failedQueue = [];

      for (const item of queue) {
        try {
          await dispatchComplaint(item);
        } catch (err) {
          console.error('Retrying sync failed for item:', item, err);
          failedQueue.push(item);
        }
      }

      if (failedQueue.length === 0) {
        clearLocalQueue();
        showToast('All pending offline reports synced successfully!', 'success');
      } else {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(failedQueue));
        refreshQueueUI();
        showToast(`${failedQueue.length} report(s) remaining in queue.`, 'warning');
      }
    });
  </script>
</body>
</html>
